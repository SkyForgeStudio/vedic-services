<section class="panchang-section">
  <div class="container">
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/utilities.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/panchang.css" />
    <div class="panchang-info">
      <div class="panchang-text">
        <h1 class="panchang-title">Today’s Panchang</h1>
        <p class="panchang-subtitle">
          Visualize the day’s energy. The chart highlights
          <strong>Rahu Kaal (avoid)</strong> and
          <strong>Abhijit Muhurat (best time)</strong>.
        </p>
        <div class="location-badge">
          PANCHANG FOR <span id="location-badge-text">Mumbai</span>
        </div>

        <!-- Status Card -->
        <div class="status-card">
          <span class="status-label">CURRENT STATUS</span>
          <div class="status-content">
            <div class="status-text">
              <h2 class="status-title" id="status-title">
                <img
                  src="../assets/images/stars.0d69f7e2.svg"
                  alt="Status Icon"
                  class="status-icon"
                />
                Auspicious (Shubh)
              </h2>
              <p class="status-desc" id="status-desc">
                Good for important activities
              </p>
            </div>
          </div>
        </div>

        <!-- Controls -->
        <div class="controls-group">
          <div class="select-wrapper">
            <select name="location" class="location-select">
              <option
                value="mumbai"
                data-lat="19.0760"
                data-lon="72.8777"
                selected
              >
                Mumbai
              </option>
              <option value="delhi" data-lat="28.6139" data-lon="77.2090">
                Delhi
              </option>
            </select>
          </div>
          <button type="button" id="btn-refresh" class="btn-refresh">
            <span class="icon-refresh"
              ><img src="../assets/images/refresh-icon.8b7c5a44.svg" /> </span
            >Refresh Data
          </button>
        </div>

        <button type="button" id="btn-view-more" class="btn-view-more">
          View more
        </button>
      </div>

      <div class="chart-info">
        <div class="chart-card">
          <div class="chart-wrapper">
            <div class="donut-chart" id="donut-chart">
              <div class="chart-center-text">
                <span class="label-now">NOW IN</span>
                <span class="location-name" id="chart-location-text"
                  >Mumbai</span
                >
              </div>
            </div>
          </div>

          <ul class="chart-legend">
            <li class="legend-item">
              <span class="dot dot-daytime"></span>
              <span class="legend-text" id="legend-daytime"
                >Day Time (54%)</span
              >
            </li>
            <li class="legend-item">
              <span class="dot dot-nighttime"></span>
              <span class="legend-text" id="legend-nighttime"
                >Night Time (46%)</span
              >
            </li>
            <li class="legend-item">
              <span class="dot dot-rahukaal"></span>
              <span class="legend-text" id="legend-rahukaal"
                >Rahu Kaal (7%)</span
              >
            </li>
            <li class="legend-item">
              <span class="dot dot-abhijit"></span>
              <span class="legend-text" id="legend-abhijit">Abhijit (4%)</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
